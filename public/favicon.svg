<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nebulaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#111528" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Ring Main Neon Gradient -->
    <linearGradient id="ringGradient" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="28%" stop-color="#00b4d8" />
      <stop offset="65%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>

    <!-- Ring Inner Shadow Gradient -->
    <linearGradient id="innerDepth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b071e" />
      <stop offset="50%" stop-color="#1f0a38" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </linearGradient>

    <!-- Sculpt Rim Highlight -->
    <linearGradient id="rimHighlight" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#a7f3d0" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#00b4d8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f72585" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Ambient Nebula Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#07080f" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Rounded Squircle Icon Container -->
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#nebulaBg)" stroke="url(#squircleBorder)" stroke-width="8" filter="url(#softShadow)" />

  <!-- Ambient Cosmic Aura inside container -->
  <circle cx="256" cy="256" r="185" fill="url(#centerGlow)" />

  <!-- 3D Ring Shadow Base -->
  <ellipse cx="256" cy="290" rx="145" ry="72" fill="#000000" opacity="0.45" transform="rotate(-18 256 290)" filter="url(#neonBloom)" />

  <!-- Ring Inner Opening / Depth Layer -->
  <ellipse cx="254" cy="256" rx="100" ry="52" fill="url(#innerDepth)" transform="rotate(-18 254 256)" stroke="#480ca8" stroke-width="8" />

  <!-- Sculpted 3D Parametric Ring Body (Torus Sculpt) -->
  <path d="M 132 230 
           C 120 170, 185 132, 275 145 
           C 365 158, 412 210, 396 270 
           C 380 330, 315 372, 225 358 
           C 145 345, 120 290, 132 230 Z" 
        fill="none" 
        stroke="url(#ringGradient)" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonBloom)" />

  <!-- Ring Top Light Bevel / Shimmer Line -->
  <path d="M 148 210 
           C 185 156, 255 148, 320 162 
           C 382 176, 398 215, 385 254" 
        fill="none" 
        stroke="url(#rimHighlight)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Inner Edge Specular Glint -->
  <path d="M 195 240 C 235 255 285 260 320 252" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- Sparkling Star Facet / Diamond Flare at Apex -->
  <g transform="translate(165, 178)">
    <!-- Flare Glow Background -->
    <circle cx="0" cy="0" r="22" fill="#00f5d4" opacity="0.5" filter="url(#neonBloom)" />
    <!-- 4-point Star -->
    <path d="M 0 -30 Q 0 0 -30 0 Q 0 0 0 30 Q 0 0 30 0 Q 0 0 0 -30 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="5.5" fill="#e0fbfc" />
  </g>

  <!-- Secondary Petite Star Accent -->
  <g transform="translate(372, 202)">
    <path d="M 0 -16 Q 0 0 -16 0 Q 0 0 0 16 Q 0 0 16 0 Q 0 0 0 -16 Z" fill="#f72585" opacity="0.95" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Micro Stardust Particles -->
  <circle cx="215" cy="120" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="340" cy="380" r="3.5" fill="#00f5d4" opacity="0.85" />
  <circle cx="115" cy="310" r="2.5" fill="#7209b7" opacity="0.8" />
  <circle cx="400" cy="315" r="2.5" fill="#f72585" opacity="0.75" />
</svg>
